name: Doc

# The guide's examples compile against crates/, so changes there must check the guide too.
on:
  push:
    branches:
      - master
      - doc
    paths:
      - docs/guide/**
      - crates/**
      - .mise/**
      - .github/workflows/doc.yml
  pull_request:
    branches:
      - master
    paths:
      - docs/guide/**
      - crates/**
      - .mise/**
      - .github/workflows/doc.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Rust
        run: |
          rustup install stable
          rustc -Vv
          cargo -V

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v5

      - run: mise run guide:check-examples

      - run: mise run guide:build

  publish-doc:
    needs: check
    if: github.ref == 'refs/heads/doc'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v5

      - name: Get crate version
        id: version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "emacs") | .version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check out GitHub Pages repo
        uses: actions/checkout@v6
        with:
          repository: ubolonton/ubolonton.github.io
          path: ubolonton.github.io
          token: ${{ secrets.PAT }}

      - name: Build guide
        env:
          MDBOOK_BOOK__TITLE: emacs-module-rs ${{ steps.version.outputs.version }}
          # The 404 page needs an absolute base URL to load its assets.
          MDBOOK_OUTPUT__HTML__SITE_URL: /emacs-module-rs/${{ steps.version.outputs.version }}/
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mdbook build docs/guide --dest-dir "ubolonton.github.io/emacs-module-rs/$VERSION"
          cd ubolonton.github.io/emacs-module-rs
          ln -sfn "$VERSION" latest
          # For version-switcher.js: version directories, newest first.
          find . -maxdepth 1 -type d -regex '\./[0-9]+\.[0-9]+\.[0-9]+' -printf '%f\n' \
            | sort -rV | jq -Rn '[inputs]' > versions.json

      - name: Publish
        env:
          # Through env, not inline, so that the message can't inject shell code.
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add emacs-module-rs/
          git diff --cached --quiet || git commit -m "auto: $HEAD_COMMIT_MESSAGE

          SourceCommit: https://github.com/ubolonton/emacs-module-rs/commit/$GITHUB_SHA"
          git push
        working-directory: ubolonton.github.io

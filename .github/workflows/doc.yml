name: Doc

# Each publish rebuilds /master/ and the recent minor versions, e.g. /0.23/, with master's theme.
# Tags add or update a minor version. docs/guide/versions.edn on master points a minor version to a
# fix made after its release. See .mise/scripts/guide-publish.bb.
#
# The guide's examples compile against crates/, so changes there must check the guide too. GitHub
# does not apply the path filters to tag pushes.
on:
  push:
    branches:
      - master
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
    paths:
      - docs/guide/**
      - crates/**
      - .mise/**
      - .github/workflows/doc.yml
  pull_request:
    branches:
      - master
    paths:
      - docs/guide/**
      - crates/**
      - .mise/**
      - .github/workflows/doc.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Rust
        run: |
          rustup install stable
          rustc -Vv
          cargo -V

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Versions build from tags and branches.
          fetch-depth: 0

      - uses: jdx/mise-action@v5

      - run: mise run guide:check-examples

      # Into a scratch directory, to check that versions.edn's refs resolve and every version builds.
      - run: mise run guide:publish target/site --all

  publish-doc:
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # Runs for different refs all push to the same Pages repo, so run them one at a time. `queue: max`
    # keeps every pending run. The default keeps only the newest, which could drop a tag's publish.
    concurrency:
      group: publish-doc
      queue: max
    runs-on: ubuntu-24.04
    steps:
      # master's theme and override list apply to all versions, whatever ref triggered the run.
      - uses: actions/checkout@v6
        with:
          ref: master
          persist-credentials: false
          fetch-depth: 0

      - uses: jdx/mise-action@v5

      - name: Check out GitHub Pages repo
        uses: actions/checkout@v6
        with:
          repository: ubolonton/ubolonton.github.io
          path: ubolonton.github.io
          token: ${{ secrets.PAT }}

      - name: Build guide
        run: mise run guide:publish ubolonton.github.io/emacs-module-rs

      - name: Publish
        env:
          # Through env, not inline, so that the message can't inject shell code.
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add emacs-module-rs/
          git diff --cached --quiet || git commit -m "auto: $GITHUB_REF_NAME: $HEAD_COMMIT_MESSAGE

          SourceCommit: https://github.com/ubolonton/emacs-module-rs/commit/$GITHUB_SHA"
          git push
        working-directory: ubolonton.github.io

[workspace]
# Standalone: this is a leaf consumer of `emacs`, not a member of its workspace, so a divergent
# `emacs-N` feature elsewhere (e.g. test-module-28) can't unify into this crate's own baseline build.

[package]
name = "test-module"
version = "0.0.0"
edition = "2024"
authors = ["Nguyễn Tuấn Anh <ubolonton@gmail.com>"]
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
emacs = { path = ".." }

[dev-dependencies]
emacs-rs-module = { path = "../rs-module" }

[features]
bindgen = ["emacs/bindgen"]

# CI has no global mise config, so enable the lockfile here.
[settings]
lockfile = true

[tools]
babashka = "1"
mdbook = "0.5"

[tasks."guide:build"]
depends = ["guide:highlight-js"]
description = "Build the guide into docs/guide/book"
run = "mdbook build docs/guide"

[tasks."guide:serve"]
depends = ["guide:highlight-js"]
description = "Serve the guide on localhost, rebuilding on changes"
run = "mdbook serve docs/guide"

[tasks."guide:check-examples"]
description = "Compile the guide's code examples, with and without optional features"
dir = "docs/guide/examples"
# Deny warnings to catch uses of deprecated APIs.
env = { RUSTFLAGS = "-D warnings" }
run = [
    "cargo check --examples --locked",
    "cargo check --examples --locked --all-features",
]

[tasks."guide:publish"]
depends = ["guide:highlight-js"]
description = "Build the guide for master and recent minor versions into a checkout of the GitHub Pages site"
usage = '''
arg "<site_dir>" help="The site's emacs-module-rs directory"
flag "--all" help="Build every minor version, not only the most recent ones"
'''
run = "bb {{config_root}}/.mise/scripts/guide-publish.bb"

[workspace]
# tests/test-module, tests/test-module-28 and tests/test-module-32 are standalone workspaces (see
# their own Cargo.toml), not members here: they intentionally require different Emacs ABI versions,
# and Cargo unifies a shared dependency's features across everything resolved together in one
# workspace. crates/rs-module stays here because it targets the same baseline ABI as the `emacs`
# crate, so there's nothing to unify away.
members = [
    "crates/*",
    "xtask",
]
resolver = "3"
